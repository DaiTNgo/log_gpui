[package]
name = "log_gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "*"
chrono = { version = "*", features = ["serde"] }
regex = "*"
rfd = "*"
anyhow = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"

gpui-component = "*"
gpui = { package = "gpui-pre", version = "*" }
unicode-normalization = "0.1.26"

russh = "=0.64.1"
russh-sftp = "=3.0.1"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "fs"] }
async-channel = "=2.5.0"
keyring = "=4.2.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.10"
ruzstd = "=0.9.1"
lzma-rs = "=0.3.0"
bzip2 = "=0.6.1"
# Finding line breaks while indexing a file.
memchr = "2.8.3"
# The lock of a file's index: a view reads it while its rows are read
# (`read_recursive`), which std's RwLock may deadlock on while Indexing
# waits to write. Already in the tree through gpui.
parking_lot = "0.12.5"
# The app's allocator: it gives the memory of a file let go back to the
# system when asked (`release_freed_memory`), where macOS malloc keeps it.
mimalloc = "0.1.48"
# mimalloc's own calls (`mi_collect`), in `extended`.
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }

[dev-dependencies]
tempfile = "3"
# GPUI test harness (VisualTestContext); never in release builds.
gpui = { package = "gpui-pre", version = "*", features = ["test-support"] }
# The Line Index spike (`examples/index_probe.rs`).
roaring = "0.11.5"

# GPUI is far too slow to scroll or type in when built without
# optimization; dependencies are optimized even in dev builds (built once).
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[target.'cfg(unix)'.dependencies]
# `getrlimit`: how many files the process may hold open.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
