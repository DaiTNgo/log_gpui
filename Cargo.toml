[package]
name = "log_gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.6.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
rfd = "0.17"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

gpui-component = "0.6.0"
gpui = { package = "gpui-pre", version = "0.3.3" }
